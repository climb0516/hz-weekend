<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>杭州周末指南</title>
  <meta name="description" content="杭州本周末天气、空气、出行建议，以及展览、免费讲座、演出玩乐">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0b0d;
      --panel: #13161a;
      --panel-2: #191d22;
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.14);
      --text-1: #eef1f3;
      --text-2: #a3abb3;
      --text-3: #69727b;
      --accent: #5eead4;
      --accent-2: #fbbf24;
      --grad: linear-gradient(120deg, #5eead4 0%, #38bdf8 50%, #a78bfa 100%);
      --sun: #fbbf24;
      --rain: #60a5fa;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(0,0,0,0.35);
    }
    :root[data-theme="light"] {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #f2f4f7;
      --hover: rgba(15,25,40,0.035);
      --line: rgba(15,25,40,0.08);
      --line-2: rgba(15,25,40,0.16);
      --text-1: #121821;
      --text-2: #4d5866;
      --text-3: #8a94a1;
      --accent: #0d9488;
      --accent-2: #d97706;
      --sun: #d97706;
      --rain: #2563eb;
      --good: #059669;
      --warn: #d97706;
      --bad: #dc2626;
      --shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(15,25,40,0.06);
    }

    body {
      background: var(--bg); color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }

    /* 顶栏 */
    .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; font-size: 16px; }
    .nav { display: flex; gap: 4px; background: var(--hover); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
    .nav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap; }
    .nav a:hover { color: var(--text-1); background: var(--panel); }
    .spacer { flex: 1; }
    .updated { font-size: 12px; color: var(--text-3); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    .live-dot.stale { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); flex-shrink: 0; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 布局 */
    .wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 60px; }
    .panel { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
    .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { color: var(--text-2); margin-top: 4px; }
    .verdict { font-size: 15px; font-weight: 600; color: var(--text-1); margin-top: 8px; max-width: 760px; }
    .section-title { font-size: 17px; font-weight: 800; margin: 34px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; scroll-margin-top: 70px; }
    .section-title small { color: var(--text-3); font-weight: 500; font-size: 12.5px; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
    .chip:hover { border-color: var(--line-2); color: var(--text-1); }
    .chip.active { background: var(--text-1); color: var(--bg); border-color: var(--text-1); }
    .chip .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .chip-sep { width: 1px; background: var(--line-2); margin: 3px 4px; }

    .badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--hover); color: var(--text-2); border: 1px solid var(--line); }
    .badge.free { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
    .badge.ending { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
    .badge.new { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .badge.soon { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 35%, transparent); background: color-mix(in srgb, var(--accent-2) 10%, transparent); }

    /* 预警 */
    .alarm { padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
    .alarm b { color: var(--bad); }
    .alarm p { color: var(--text-2); font-size: 13px; margin-top: 4px; }

    /* 周末天气 */
    .wk { display: grid; grid-template-columns: 1fr 1fr 320px; gap: 14px; }
    .day { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .day-head { display: flex; justify-content: space-between; align-items: baseline; }
    .day-name { font-size: 15px; font-weight: 800; }
    .day-date { color: var(--text-3); font-size: 12.5px; }
    .day-main { display: flex; align-items: center; gap: 14px; }
    .day-ico { font-size: 44px; line-height: 1; }
    .day-temp { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
    .day-temp span { color: var(--text-3); font-weight: 600; font-size: 20px; }
    .day-text { color: var(--text-2); font-weight: 600; }
    .day-stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .stat label { display: block; font-size: 11.5px; color: var(--text-3); }
    .stat b { font-size: 14.5px; font-weight: 700; }
    .rainbar { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; align-items: end; height: 46px; }
    .rainbar i { display: block; border-radius: 3px 3px 1px 1px; background: var(--rain); min-height: 2px; opacity: .85; }
    .rainaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 4px; }
    .tip { font-size: 13px; color: var(--text-1); padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 9%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
    .tip.indoor { background: color-mix(in srgb, var(--rain) 9%, transparent); border-color: color-mix(in srgb, var(--rain) 28%, transparent); }

    .side { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .side h3 { font-size: 13px; font-weight: 700; color: var(--text-2); }
    .now { display: flex; align-items: center; gap: 12px; }
    .now b { font-size: 26px; font-weight: 800; }
    .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); gap: 10px; }
    .kv:last-child { border-bottom: 0; }
    .kv span:first-child { color: var(--text-3); white-space: nowrap; }
    .kv span:last-child { text-align: right; }
    .idx { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .idx div { background: var(--panel-2); border-radius: 9px; padding: 7px 9px; font-size: 12px; min-width: 0; }
    .idx div b { display: block; font-size: 13px; }
    .idx div span { color: var(--text-3); }

    /* 10 天 */
    .days10 { display: grid; grid-template-columns: repeat(10, minmax(0,1fr)); gap: 6px; padding: 12px; margin-top: 14px; }
    .d10 { text-align: center; padding: 8px 2px; border-radius: 10px; min-width: 0; }
    .d10.we { background: var(--panel-2); }
    .d10 .w { font-size: 12px; font-weight: 700; }
    .d10 .dt { font-size: 11px; color: var(--text-3); }
    .d10 .ic { font-size: 22px; margin: 4px 0; }
    .d10 .t { font-size: 12.5px; font-weight: 600; }
    .d10 .p { font-size: 11px; color: var(--rain); }

    /* 展览卡片 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .card { display: flex; flex-direction: column; overflow: hidden; min-width: 0; transition: transform .15s; }
    .card:hover { transform: translateY(-2px); }
    .poster { aspect-ratio: 4 / 3; background: var(--panel-2) center / cover no-repeat; position: relative; }
    .poster .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 36px; opacity: .35; }
    .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card-title { font-weight: 700; font-size: 14.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 12.5px; color: var(--text-2); }
    .card-meta.dim { color: var(--text-3); }
    .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }

    /* 列表 */
    .list { overflow: hidden; }
    .row { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: var(--hover); }
    .thumb { width: 64px; height: 64px; border-radius: 10px; background: var(--panel-2) center / cover no-repeat; display: grid; place-items: center; font-size: 24px; }
    .row-title { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row-meta { font-size: 12.5px; color: var(--text-2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .fee { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .fee.free { color: var(--good); }
    .empty { padding: 28px; text-align: center; color: var(--text-3); }
    .more { display: block; width: 100%; padding: 11px; color: var(--text-2); font-weight: 600; font-size: 13px; border-top: 1px solid var(--line); }
    .more:hover { color: var(--text-1); background: var(--hover); }

    /* 来源 */
    .sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 14px; }
    .src { display: flex; align-items: center; gap: 8px; font-size: 12.5px; min-width: 0; }
    .src i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
    .src i.stale { background: var(--warn); }
    .src i.fail { background: var(--bad); }
    .src span { color: var(--text-3); margin-left: auto; white-space: nowrap; }
    .foot { color: var(--text-3); font-size: 12px; margin-top: 18px; line-height: 1.7; }

    @media (max-width: 1080px) {
      .wk { grid-template-columns: 1fr 1fr; }
      .wk .side { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    }
    /* 去哪玩：照片卡 */
    .pgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    .pcard { display: flex; flex-direction: column; overflow: hidden; min-width: 0; transition: transform .15s; }
    .pcard:hover { transform: translateY(-2px); }
    .pcard .ph { position: relative; aspect-ratio: 4 / 3; background: var(--panel-2) center / cover no-repeat; transition: background-image .2s; }
    .pcard .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.55)); }
    .pcard .cat { position: absolute; left: 10px; top: 10px; z-index: 1; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; }
    .pcard .rt { position: absolute; right: 10px; bottom: 9px; z-index: 1; font-size: 13px; font-weight: 700; color: #fff; }
    .pcard .rt small { font-weight: 500; opacity: .8; margin-left: 6px; }
    .pcard .np { position: absolute; left: 10px; bottom: 9px; z-index: 1; display: flex; gap: 4px; }
    .pcard .np i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
    .pcard .np i.on { background: #fff; }
    .pcard .pb { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .pcard .pn { font-weight: 700; font-size: 13.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pcard .pm { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pcard .cat, .pcard .rk { font-size: 11px; padding: 1px 6px; }
    .see-all { grid-column: 1 / -1; display: block; text-align: center; padding: 11px; border-radius: 12px; font-weight: 600; font-size: 13.5px; color: var(--text-2); }
    .see-all:hover { color: var(--text-1); }
    /* 列表页（#/list…）：顶部返回 + 筛选 + 全部地点 */
    .lv-head { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; flex-wrap: wrap; }
    .lv-back { padding: 7px 14px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; color: var(--text-2); }
    .lv-back:hover { color: var(--text-1); border-color: var(--line-2); }
    .lv-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .lv-head small { color: var(--text-3); font-size: 13px; }
    .pcard .pt { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
    .rec-why { margin: -4px 0 12px; font-size: 13px; color: var(--text-2); }
    /* 一行天气条 */
    .hero h1 { font-size: 28px; }
    .wx { display: flex; align-items: center; gap: 18px; padding: 10px 16px; margin-bottom: 6px; flex-wrap: wrap; }
    .wx-d { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-2); }
    .wx-d b { color: var(--text-1); font-weight: 700; }
    .wx-d .ic { font-size: 18px; } .wx-d .pop { color: var(--rain); }
    .wx-v { font-size: 14px; font-weight: 600; margin-left: auto; }
    .wx-btn { font-size: 13px; color: var(--text-2); padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); }
    .wx-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .wx-more { margin-top: 12px; }
    .bar2 { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
    .bar2 .chips { margin-bottom: 0; }
    .seg { display: inline-flex; background: var(--hover); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
    .seg button { padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
    .seg button.active { background: var(--panel); color: var(--text-1); box-shadow: 0 0 0 1px var(--line-2); }
    .seg .n { opacity: .55; margin-left: 4px; }
    /* 收费 / 免费标签、榜单徽章 */
    .fee { display: inline-flex; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
    .fee-free { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
    .fee-paid { color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 14%, transparent); }
    .fee-unk { color: var(--text-3); background: var(--hover); }
    .pcard .rk { position: absolute; right: 10px; top: 10px; z-index: 1; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgba(251,191,36,.92); color: #3b2500; }
    /* 吃什么：榜单式两列 */
    .rlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .rrow { display: grid; grid-template-columns: 34px 112px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; transition: transform .15s; }
    .rrow:hover { transform: translateY(-2px); }
    .rn { font-size: 22px; font-weight: 800; color: var(--text-3); text-align: center; }
    .rrow:nth-child(-n+3) .rn { color: var(--accent-2); }
    .rph { width: 112px; height: 84px; border-radius: 10px; background: center / cover no-repeat var(--panel-2); }
    .rb { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .rs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
    .rs b { color: var(--accent-2); }
    .rbadge { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: rgba(251,191,36,.18); color: var(--accent-2); }
    /* 看展：横向滑动 */
    .hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 220px; gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .hscroll > * { scroll-snap-align: start; }
    .hscroll .poster { aspect-ratio: 3 / 4; }
    @media (max-width: 760px) {
      .wx { gap: 10px; } .wx-v { margin-left: 0; width: 100%; order: 3; } .wx-btn { margin-left: auto; }
      .rlist { grid-template-columns: 1fr; }
      .rrow { grid-template-columns: 26px 84px minmax(0, 1fr); gap: 10px; } .rph { width: 84px; height: 66px; } .rn { font-size: 18px; }
      .hscroll { grid-auto-columns: 160px; }
    }
    /* 地点详情弹窗 */
    .modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.62); display: grid; place-items: center; padding: 24px; }
    .modal[hidden] { display: none; }
    .sheet { width: min(760px, 100%); max-height: calc(100vh - 48px); overflow: auto; background: var(--panel); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.5); position: relative; }
    .sheet .x { position: absolute; top: 12px; right: 12px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 18px; display: grid; place-items: center; }
    .gal { position: relative; aspect-ratio: 16 / 9; max-height: 44vh; width: 100%; background: var(--panel-2) center / cover no-repeat; }
    .gal .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 20px; display: grid; place-items: center; }
    .gal .prev { left: 12px; } .gal .next { right: 12px; }
    .thumbs { display: flex; gap: 8px; padding: 10px 20px 0; }
    .thumbs i { width: 72px; height: 50px; border-radius: 8px; background: center / cover no-repeat var(--panel-2); cursor: pointer; opacity: .55; border: 2px solid transparent; }
    .thumbs i.on { opacity: 1; border-color: var(--accent); }
    .sbody { padding: 16px 22px 22px; display: flex; flex-direction: column; gap: 12px; }
    .sbody h3 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }
    .score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--text-2); }
    .score b { font-size: 20px; color: var(--accent-2); }
    .info { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .info div { display: grid; grid-template-columns: 24px 1fr; gap: 6px; }
    .info a { color: var(--accent); }
    .wtip { padding: 10px 12px; border-radius: 10px; font-size: 13.5px; background: var(--panel-2); line-height: 1.6; }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .acts a { padding: 11px 12px; border-radius: 11px; text-align: center; font-weight: 600; font-size: 14px; background: var(--panel-2); border: 1px solid var(--line); }
    .acts a:hover { border-color: var(--line-2); }
    .acts a.primary { background: var(--text-1); color: var(--bg); border-color: var(--text-1); }
    @media (max-width: 760px) {
      .modal { padding: 0; place-items: end center; }
      .sheet { max-height: 92vh; border-radius: 18px 18px 0 0; }
    }
    @media (max-width: 1200px) { .pgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    @media (max-width: 760px) {
      .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .pcard .pn { font-size: 13px; }
      .topbar-inner { padding: 10px 16px; gap: 10px; }
      .nav, .updated .txt { display: none; }
      .wrap { padding: 16px 16px 48px; }
      .hero h1 { font-size: 22px; }
      .wk { grid-template-columns: 1fr; }
      .wk .side { display: flex; }
      .days10 { grid-template-columns: repeat(5, minmax(0,1fr)); }
      .grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
      .card-title { font-size: 13.5px; }
      .row { grid-template-columns: 48px minmax(0,1fr); gap: 10px; padding: 11px 12px; }
      .thumb { width: 48px; height: 48px; font-size: 20px; }
      .row-right { grid-column: 2; flex-direction: row; justify-content: flex-start; align-items: center; }
      .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .chips::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><div class="logo-mark">🌤</div>杭州周末指南</div>
      <nav class="nav">
        <a href="#places">玩什么</a><a href="#food">吃什么</a><a href="#exhibitions">看展</a><a href="#fun">活动</a>
      </nav>
      <div class="spacer"></div>
      <div class="updated"><span class="live-dot" id="dot"></span><span class="txt" id="updated">加载中…</span></div>
      <button class="icon-btn" id="reload" title="重新读取数据">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <a class="icon-btn" href="https://github.com/climb0516/hz-weekend/actions/workflows/scrape.yml" target="_blank" rel="noopener" title="去 GitHub Actions 手动触发抓取">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </a>
      <button class="icon-btn" id="theme" title="切换深浅色">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <div id="listview" hidden></div>
    <div id="home">
    <section class="hero" id="weather">
      <h1>杭州 · <em id="wk-title">本周末</em>去哪</h1>
      <p id="wk-sub"></p>
    </section>
    <div id="alarms"></div>
    <!-- 天气只占一行；详细（逐小时、10 天、生活指数）默认收起 -->
    <div class="panel wx" id="wx-strip"></div>
    <div class="wx-more" id="wx-more" hidden>
      <div class="wk">
        <div class="panel day" id="day0"></div>
        <div class="panel day" id="day1"></div>
        <aside class="panel side" id="side"></aside>
      </div>
      <div class="panel days10" id="days10"></div>
    </div>

    <h2 class="section-title" id="places">🧭 玩什么 <small id="pl-sub"></small></h2>
    <div class="chips" id="pl-district"></div>
    <div class="bar2"><div class="chips" id="pl-cats"></div><div class="seg" id="pl-fee"></div></div>
    <div class="pgrid" id="pl-grid"></div>

    <h2 class="section-title" id="food">🍜 吃什么 <small id="fd-sub"></small></h2>
    <div class="chips" id="fd-tabs"></div>
    <div class="rlist" id="fd-list"></div>

    <h2 class="section-title" id="exhibitions">🖼 看展 <small id="exh-sub"></small></h2>
    <div class="chips" id="exh-filter"></div>
    <div class="hscroll" id="exh-grid"></div>

    <h2 class="section-title" id="fun">🎟 活动 <small>免费讲座、展览、读书会，以及演出和玩乐</small></h2>
    <div class="bar2"><div class="seg" id="ev-tab"><button class="active" data-t="free">免费活动</button><button data-t="fun">演出玩乐</button></div></div>
    <div id="ev-free"><div class="chips" id="free-filter"></div><div class="panel list" id="free-list"></div></div>
    <div id="ev-fun" hidden><div class="chips" id="fun-filter"></div><div class="panel list" id="fun-list"></div></div>

    <h2 class="section-title">📡 数据来源</h2>
    <div class="panel sources" id="sources"></div>
    <p class="foot">
      天气每 3 小时自动抓取一次：数值来自 Open-Meteo，中文天气描述、生活指数、空气质量预报来自中国天气网。展览以各馆官网为准，豆瓣同城、秀动为第三方发布，时间票价以活动页为准。<br>
      浙江省博物馆、浙江自然博物院等需提前在官方小程序预约。杭州限行为工作日早晚高峰错峰限行，周末和法定节假日不限行。
    </p>
    </div>
    <div class="modal" id="pl-modal" hidden><div class="sheet" id="pl-sheet" role="dialog" aria-modal="true"></div></div>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const store = {
      get(k, d) { try { const v = localStorage.getItem('hzw:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
      set(k, v) { try { localStorage.setItem('hzw:' + k, JSON.stringify(v)); } catch {} },
    };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const pd = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
    const md = s => { const d = pd(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
    const dayDiff = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
    const todayStr = () => { const d = new Date(Date.now() + (480 + new Date().getTimezoneOffset()) * 60000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

    // 天气图标：优先按中国天气网中文描述，退回 Open-Meteo WMO 代码
    function icon(text, code) {
      const t = text || '';
      if (/雷/.test(t)) return '⛈';
      if (/雪/.test(t)) return '🌨';
      if (/暴雨|大雨/.test(t)) return '🌧';
      if (/雨/.test(t)) return /晴|云/.test(t) ? '🌦' : '🌧';
      if (/雾|霾/.test(t)) return '🌫';
      if (/阴/.test(t)) return '☁️';
      if (/多云/.test(t)) return /晴/.test(t) ? '🌤' : '⛅';
      if (/晴/.test(t)) return '☀️';
      if (code == null) return '🌡';
      if (code >= 95) return '⛈';
      if (code >= 71 && code <= 86 && !(code >= 80 && code <= 82)) return '🌨';
      if (code >= 51) return '🌧';
      if (code >= 45) return '🌫';
      if (code === 3) return '☁️';
      if (code >= 1) return '⛅';
      return '☀️';
    }
    const WMO = c => c >= 95 ? '雷雨' : c >= 80 ? '阵雨' : c >= 71 ? '雪' : c >= 61 ? '雨' : c >= 51 ? '毛毛雨' : c >= 45 ? '雾' : c === 3 ? '阴' : c >= 1 ? '多云' : '晴';
    const aqiColor = lv => /优/.test(lv) ? 'var(--good)' : /良/.test(lv) ? 'var(--warn)' : lv ? 'var(--bad)' : 'var(--text-3)';

    // 出行建议：按降雨、空气、温度给一句话
    function advise(d) {
      if (!d) return { indoor: false, text: '暂无预报' };
      const rainy = d.pop >= 60 || d.rain >= 5 || /雨|雪/.test(d.text || '');
      const tips = [];
      let indoor = false;
      if (rainy && (d.rain >= 10 || /中雨|大雨|暴雨/.test(d.text || ''))) { indoor = true; tips.push('雨不小，室内为主：逛展、图书馆、看演出'); }
      else if (rainy) { indoor = true; tips.push('有雨，带伞；户外可选灵隐、龙井这类有遮蔽的线路，或安排室内'); }
      else if (d.tmax >= 33) tips.push('偏热，户外放在早晚，午后去室内');
      else if (d.tmax <= 8) tips.push('偏冷，户外注意保暖');
      else tips.push('适合户外：西湖骑行、九溪徒步、宝石山看日落');
      if (/中度|重度|严重/.test(d.aqi_level || '')) { indoor = true; tips.push('空气较差，减少户外运动'); }
      if (d.uv >= 7 && !rainy) tips.push('紫外线强，注意防晒');
      if (d.tmax - d.tmin >= 10) tips.push(`昼夜温差 ${d.tmax - d.tmin}°，带件外套`);
      return { indoor, text: tips.join('；') };
    }

    function renderDay(el, d, hourly, label) {
      if (!d) { el.innerHTML = `<div class="empty">${label}暂无预报</div>`; return; }
      const a = advise(d);
      const hrs = (hourly || []).filter(h => h.h >= 8 && h.h <= 22);
      const aqi = d.aqi != null ? `${d.aqi} <small style="color:${aqiColor(d.aqi_level)}">${esc(d.aqi_level)}</small>`
        : d.aqi_level ? `<span style="color:${aqiColor(d.aqi_level)}">${esc(d.aqi_level)}</span>` : '—';
      el.innerHTML = `
        <div class="day-head"><span class="day-name">${label}</span><span class="day-date">${md(d.date)} · 日出 ${esc(d.sunrise)} 日落 ${esc(d.sunset)}</span></div>
        <div class="day-main">
          <div class="day-ico">${icon(d.text, d.code)}</div>
          <div><div class="day-temp num">${d.tmax}°<span> / ${d.tmin}°</span></div><div class="day-text">${esc(d.text || WMO(d.code))}${d.wind ? ' · ' + esc(d.wind) : ''}</div></div>
        </div>
        <div class="day-stats">
          <div class="stat"><label>降雨概率</label><b class="num" style="color:${d.pop >= 60 ? 'var(--rain)' : 'inherit'}">${d.pop ?? '—'}%</b></div>
          <div class="stat"><label>降水量</label><b class="num">${d.rain ?? '—'} mm</b></div>
          <div class="stat"><label>空气 AQI</label><b class="num">${aqi}</b></div>
        </div>
        ${hrs.length ? `<div><div class="rainbar" title="8 点到 22 点逐小时降雨概率">${hrs.map(h => `<i style="height:${Math.max(4, h.pop)}%" title="${h.h} 点 · ${h.t}° · 降雨 ${h.pop}%"></i>`).join('')}</div>
          <div class="rainaxis"><span>8 点</span><span>逐小时降雨概率</span><span>22 点</span></div></div>` : ''}
        <div class="tip ${a.indoor ? 'indoor' : ''}">${a.indoor ? '🏛' : '🚲'} ${esc(a.text)}</div>`;
    }

    function renderSide(data) {
      const n = data.now || {};
      const idx = (data.indices || []).filter(x => ['ct', 'yd', 'tr', 'uv', 'gm', 'ls'].includes(x.key));
      $('#side').innerHTML = `
        <div><h3>此刻 ${n.time ? '· ' + esc(n.time) + ' 发布' : ''}</h3>
          <div class="now" style="margin-top:8px"><span style="font-size:32px">${icon(n.weather, n.code)}</span><b class="num">${n.temp != null ? Math.round(n.temp) + '°' : '—'}</b>
          <span style="color:var(--text-2)">${esc(n.weather || WMO(n.code))}</span></div></div>
        <div>
          <div class="kv"><span>风</span><span>${esc(n.wind || '—')}</span></div>
          <div class="kv"><span>湿度</span><span>${esc(n.humidity || '—')}</span></div>
          <div class="kv"><span>空气 AQI</span><span class="num">${esc(n.aqi || '—')}</span></div>
          <div class="kv"><span>今日限行尾号</span><span>${n.limit ? esc(n.limit) + '<br><small style="color:var(--text-3)">周末不限行</small>' : '周末不限行'}</span></div>
        </div>
        ${idx.length ? `<div><h3 style="margin-bottom:8px">今日生活指数</h3><div class="idx">${idx.map(x => `<div title="${esc(x.desc)}"><span>${esc(x.name)}</span><b>${esc(x.hint)}</b></div>`).join('')}</div></div>` : ''}`;
    }

    function renderWeather(data) {
      const [sat, sun] = data.weekend;
      const byDate = Object.fromEntries((data.daily || []).map(d => [d.date, d]));
      const today = todayStr();
      const inWeekend = today === sat || today === sun;
      $('#wk-title').textContent = inWeekend ? '这个周末' : '本周末';
      $('#wk-sub').textContent = `${md(sat)} 周六 – ${md(sun)} 周日` + (inWeekend ? '' : ` · 还有 ${dayDiff(today, sat)} 天`);
      addHol();
      const s = byDate[sat], u = byDate[sun];
      const as = advise(s), au = advise(u);
      let v;
      if (!s && !u) v = '周末预报还没出来';
      else if (as.indoor && au.indoor) v = '☔ 两天有雨，推荐偏室内';
      else if (as.indoor && !au.indoor) v = '周六有雨、周日转好，户外放周日';
      else if (!as.indoor && au.indoor) v = '周六天气好、周日有雨，户外放周六';
      else v = '🌿 两天都适合出门';
      // 一行天气条：两天的温度 / 天气 / 降雨概率 + 结论，「详细」展开原来的大卡片
      const cell = (x, n) => x ? `<div class="wx-d"><b>${n}</b><span class="ic">${icon(x.text, x.code)}</span><span class="num">${x.tmin}~${x.tmax}°</span><span>${esc(x.text || WMO(x.code))}</span><span class="pop num">${x.pop ?? 0}%</span></div>` : '';
      const open = !$('#wx-more').hidden;
      $('#wx-strip').innerHTML = `${cell(s, '周六')}${cell(u, '周日')}<div class="wx-v">${v}</div>
        <button class="wx-btn" id="wx-toggle">${open ? '收起' : '详细'} ▾</button>`;
      $('#wx-toggle').onclick = () => { $('#wx-more').hidden = !$('#wx-more').hidden; renderWeather(DATA); };
      renderDay($('#day0'), s, data.hourly?.[sat], '周六');
      renderDay($('#day1'), u, data.hourly?.[sun], '周日');
      renderSide(data);
      $('#alarms').innerHTML = (data.alarms || []).map(a =>
        `<div class="alarm"><b>⚠️ ${esc(a.type)}${esc(a.level)}预警</b>${a.time ? ` <small style="color:var(--text-3)">${esc(a.time)}</small>` : ''}<p>${esc(a.desc)}</p></div>`).join('');
      $('#days10').innerHTML = (data.daily || []).map(d => {
        const w = pd(d.date).getDay();
        return `<div class="d10 ${w === 0 || w === 6 ? 'we' : ''}" title="${esc(d.text || WMO(d.code))}">
          <div class="w">${d.date === today ? '今天' : WEEK[w]}</div><div class="dt">${md(d.date)}</div>
          <div class="ic">${icon(d.text, d.code)}</div><div class="t num">${d.tmin}~${d.tmax}°</div><div class="p num">${d.pop ?? 0}%</div></div>`;
      }).join('');
    }

    // ── 展览 ──
    const exhState = { f: store.get('exhF', 'weekend'), venue: 'all' };
    function exhTags(x, sat, sun, today) {
      const tags = [];
      if (x.free) tags.push(['free', x.fee || '免费']);
      else if (x.fee) tags.push(['', x.fee]);
      if (x.end && x.start && dayDiff(x.start, x.end) > 400) tags.push(['', '常设']);
      else if (x.end) {
        const left = dayDiff(today, x.end);
        if (left <= 14) tags.push(['ending', left <= 0 ? '今天最后一天' : `还剩 ${left} 天`]);
      }
      if (x.start && x.start > today) tags.push(['soon', `${md(x.start)} 开展`]);
      else if (x.start && dayDiff(x.start, today) <= 10) tags.push(['new', '新展']);
      return tags;
    }
    function renderExh(data) {
      const [sat, sun] = data.weekend, today = todayStr();
      const all = (data.exhibitions || []).map(x => ({ ...x, tags: exhTags(x, sat, sun, today) }));
      const onWeekend = x => !x.start || (x.start <= sun && (!x.end || x.end >= sat));
      const filters = {
        weekend: ['本周末在展', onWeekend],
        ending: ['即将撤展', x => x.end && dayDiff(today, x.end) <= 14 && dayDiff(today, x.end) >= 0],
        new: ['新开 / 即将开展', x => x.start && (x.start > today || dayDiff(x.start, today) <= 10)],
        free: ['免费', x => x.free],
        all: ['全部', () => true],
      };
      if (!filters[exhState.f]) exhState.f = 'weekend';
      const venues = [...new Set(all.map(x => x.source))];
      $('#exh-filter').innerHTML = Object.entries(filters).map(([k, [name, fn]]) =>
        `<button class="chip ${exhState.f === k ? 'active' : ''}" data-f="${k}">${name}<span class="n">${all.filter(fn).length}</span></button>`).join('')
        + '<span class="chip-sep"></span>'
        + ['all', ...venues].map(v => `<button class="chip ${exhState.venue === v ? 'active' : ''}" data-v="${esc(v)}">${v === 'all' ? '全部场馆' : esc(v)}</button>`).join('');
      const list = all.filter(filters[exhState.f][1]).filter(x => exhState.venue === 'all' || x.source === exhState.venue)
        .sort((a, b) => (a.end || '9999').localeCompare(b.end || '9999'));
      $('#exh-sub').textContent = `${all.length} 个展览 · 按撤展时间排序，快结束的在前`;
      $('#exh-grid').innerHTML = list.length ? list.map(x => `
        <a class="panel card" href="${esc(x.url)}" target="_blank" rel="noopener">
          <div class="poster" ${x.img ? `data-bg="${esc(x.img)}"` : ''}><div class="ph">🖼</div></div>
          <div class="card-body">
            <div class="card-title">${esc(x.title)}</div>
            <div class="card-meta">${esc(x.venue)}${x.hall ? ' · ' + esc(x.hall) : ''}</div>
            <div class="card-meta dim num">${x.start ? `${md(x.start)} – ${x.end ? md(x.end) + (x.end.slice(0, 4) !== today.slice(0, 4) ? ` (${x.end.slice(0, 4)})` : '') : '未定'}` : x.published ? `展期见官网 · 发布于 ${md(x.published)}` : '展期见官网'}</div>
            <div class="badges">${x.tags.map(([c, t]) => `<span class="badge ${c}">${esc(t)}</span>`).join('')}</div>
          </div>
        </a>`).join('') : '<div class="panel empty" style="grid-column:1/-1">这个筛选下没有展览</div>';
      loadPosters($('#exh-grid'));
    }
    $('#exh-filter').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      if (b.dataset.f) { exhState.f = b.dataset.f; store.set('exhF', exhState.f); }
      if (b.dataset.v) exhState.venue = b.dataset.v;
      renderExh(DATA);
    });

    // 豆瓣海报有防盗链，去掉 referrer 再加载；加载失败保留占位
    function loadPosters(root) {
      root.querySelectorAll('[data-bg]').forEach(el => {
        const img = new Image();
        img.referrerPolicy = 'no-referrer';
        img.onload = () => { el.style.backgroundImage = `url("${img.src}")`; el.querySelector('.ph')?.remove(); el.textContent = ''; };
        img.src = el.dataset.bg;
      });
    }

    // ── 活动列表（免费 / 玩乐共用）──
    function whenText(x) {
      if (x.start) {
        const s = x.start.replace('T', ' '), e = (x.end || '').replace('T', ' ');
        const hm = s.slice(11, 16);
        if (!e || s.slice(0, 10) === e.slice(0, 10)) return `${md(s)} ${WEEK[pd(s).getDay()]}${hm ? ' ' + hm : ''}`;
        // 已经开始的长期活动（常驻演出、每周读书会）只说截止日
        if (s.slice(0, 10) < todayStr()) return `进行中 · 至 ${md(e)}`;
        return `${md(s)} – ${md(e)}`;
      }
      return x.published ? `发布于 ${md(x.published)}，时间见详情` : '';
    }
    const catIcon = c => ({ 讲座: '🎤', 沙龙: '☕', 展览: '🖼', 阅读推广: '📚', 培训: '📝', 戏剧: '🎭', 音乐: '🎵', 演出: '🎸', 电影: '🎬', 聚会: '🥂', 运动: '🏸', 体验: '✨', 市集: '🛍' }[c] || '📌');
    function rowHtml(x) {
      return `<a class="row" href="${esc(x.url)}" target="_blank" rel="noopener">
        <div class="thumb" ${x.img ? `data-bg="${esc(x.img)}"` : ''}><span class="ph">${catIcon(x.cat)}</span></div>
        <div style="min-width:0"><div class="row-title">${esc(x.title)}</div>
          <div class="row-meta">${esc(whenText(x))}${x.place ? ' · ' + esc(x.place) : ''}</div></div>
        <div class="row-right"><span class="fee ${x.free ? 'free' : ''}">${esc(x.fee || '')}</span><span class="badge">${esc(x.cat)} · ${esc(x.source)}</span></div>
      </a>`;
    }
    function renderList(opts) {
      const { items, filterEl, listEl, state, key, emptyText } = opts;
      const cats = {};
      items.forEach(x => cats[x.cat] = (cats[x.cat] || 0) + 1);
      const names = ['all', ...Object.keys(cats).sort((a, b) => cats[b] - cats[a])];
      if (!names.includes(state.cat)) state.cat = 'all';
      filterEl.innerHTML = names.map(c => `<button class="chip ${state.cat === c ? 'active' : ''}" data-c="${esc(c)}">${c === 'all' ? '全部' : catIcon(c) + ' ' + esc(c)}<span class="n">${c === 'all' ? items.length : cats[c]}</span></button>`).join('')
        + (opts.freeToggle ? `<span class="chip-sep"></span><button class="chip ${state.free ? 'active' : ''}" data-free="1">只看免费</button>` : '');
      const list = items.filter(x => (state.cat === 'all' || x.cat === state.cat) && (!state.free || x.free));
      const shown = state.expanded ? list : list.slice(0, 12);
      listEl.innerHTML = (shown.length ? shown.map(rowHtml).join('') : `<div class="empty">${emptyText}</div>`)
        + (list.length > shown.length ? `<button class="more" data-more="1">展开全部 ${list.length} 条</button>` : '');
      loadPosters(listEl);
      filterEl.onclick = e => {
        const b = e.target.closest('.chip'); if (!b) return;
        if (b.dataset.c) state.cat = b.dataset.c;
        if (b.dataset.free) state.free = !state.free;
        state.expanded = false; store.set(key, { cat: state.cat, free: state.free });
        renderList(opts);
      };
      listEl.onclick = e => { if (e.target.closest('[data-more]')) { state.expanded = true; renderList(opts); } };
    }

    const freeState = { ...store.get('free', { cat: 'all' }), expanded: false };
    const funState = { ...store.get('fun', { cat: 'all', free: false }), expanded: false };
    function sortKey(x) { return (x.start || x.published || '').replace('T', ' '); }
    function renderEvents(data) {
      const [sat, sun] = data.weekend;
      // 免费活动：图书馆全部 + 豆瓣标免费的（且与周末有交集）
      const overlap = x => !x.start || (x.start.slice(0, 10) <= sun && (x.end || x.start).slice(0, 10) >= sat);
      const dbFree = (data.events || []).filter(x => x.free && overlap(x));
      // 有明确时间且落在周末的排前面；杭图只有发布日期，只留最近 3 周发布的，按发布时间倒序
      const today = todayStr();
      const free = [...(data.free || []), ...dbFree]
        .filter(x => !x.published || dayDiff(x.published, today) <= 21)
        .map(x => ({ ...x, _g: x.start ? (overlap(x) ? 0 : 1) : 2 }))
        .sort((a, b) => a._g - b._g || (a._g === 2 ? (b.published || '').localeCompare(a.published || '') : sortKey(a).localeCompare(sortKey(b))));
      renderList({ items: free, filterEl: $('#free-filter'), listEl: $('#free-list'), state: freeState, key: 'free', emptyText: '暂无免费活动' });
      // 玩乐：豆瓣周末（非免费）+ 秀动未来演出。周末当天开场的 > 周末仍在进行的长期活动 > 之后的演出
      const startsOnWeekend = x => x.start && x.start.slice(0, 10) >= sat && x.start.slice(0, 10) <= sun;
      const fun = (data.events || []).filter(x => !(x.free && overlap(x)))
        .map(x => ({ ...x, _w: startsOnWeekend(x) ? 0 : overlap(x) ? 1 : 2 }))
        .sort((a, b) => a._w - b._w || (a._w === 1 ? (a.end || '').localeCompare(b.end || '') : sortKey(a).localeCompare(sortKey(b))));
      renderList({ items: fun, filterEl: $('#fun-filter'), listEl: $('#fun-list'), state: funState, key: 'fun', freeToggle: false, emptyText: '暂无活动' });
    }

    function renderSources(data) {
      const srcs = data.sources || [];
      $('#sources').innerHTML = srcs.map(s => `<div class="src" title="${esc(s.error || '')}"><i class="${s.ok ? '' : s.stale ? 'stale' : 'fail'}"></i>${esc(s.name)}
        <span>${s.ok ? s.count + ' 条' : s.stale ? '旧数据' : '失败'}</span></div>`).join('');
      const bad = srcs.filter(s => !s.ok).length;
      $('#dot').classList.toggle('stale', bad > 0);
      const t = new Date(data.updated);
      $('#updated').textContent = `${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} 更新` + (bad ? ` · ${bad} 个来源异常` : '');
    }

    // ── 去哪玩：高德 POI，按区 × 类别，「推荐」按周末天气混排 ──
    let PLACES = null;
    const plState = { district: store.get('district', null), cat: store.get('plCat', 'rec'), fee: store.get('plFee', 'all'), more: false };
    const CAT_ICON = { rec: '✨', camp: '⛺', outdoor: '🌲', kids: '🧒', indoor: '☔', food: '🍜' };
    const FEE = { free: ['免费', 'fee-free'], paid: ['收费', 'fee-paid'], '': ['门票待确认', 'fee-unk'] };
    async function loadPlaces() {
      try {
        PLACES = await fetch('places.json', { cache: 'no-cache' }).then(r => r.json());
        renderPlaces(); renderFood();
        route();
        // 地点推荐的抓取状态并入底部「数据来源」
        const st = PLACES.status || {};
        $('#sources').insertAdjacentHTML('beforeend', `<div class="src" title="${esc(st.error || '')}"><i class="${st.ok ? '' : 'stale'}"></i>高德地点推荐
          <span>${st.ok ? `${Object.keys(PLACES.districts).length} 个区` : esc(st.error || '异常') + '，沿用旧数据'}</span></div>`);
      } catch (e) { console.error(e); $('#pl-grid').innerHTML = '<div class="panel empty" style="grid-column:1/-1">地点数据加载失败</div>'; }
    }
    function weekendRainy() {
      if (!DATA) return false;
      const by = Object.fromEntries((DATA.daily || []).map(x => [x.date, x]));
      const r = DATA.weekend.map(d => advise(by[d]).indoor);
      return r[0] && r[1];
    }
    // 免费的占 2/3：免费、免费、收费 / 待确认 轮着排，某一边用完就用另一边补
    function freeFirst(list) {
      const free = list.filter(x => x.fee === 'free'), rest = list.filter(x => x.fee !== 'free'), out = [];
      while (free.length || rest.length) { out.push(...free.splice(0, 2)); if (rest.length) out.push(rest.shift()); }
      return out;
    }
    function recMix(cats) {
      // 两天都有雨：室内 / 遛娃；否则：露营 / 户外 / 遛娃。类别轮流取，避免一屏同一类
      const order = weekendRainy() ? ['indoor', 'kids', 'outdoor'] : ['camp', 'outdoor', 'kids'];
      const lists = order.map(c => freeFirst(cats[c] || []));
      const out = [];
      while (out.length < 60 && lists.some(l => l.length)) lists.forEach(l => l.length && out.push(l.shift()));
      return out;
    }
    // 上了「状元榜·景点」的地点挂徽章
    function scenicRank(id) { return (PLACES.rankings?.lists?.scenic || []).find(x => x.id === id); }
    function feeBadge(p) {
      const [t, c] = FEE[p.fee || ''] || FEE[''];
      return p.fee === 'paid' && p.cost ? `<span class="fee ${c}">收费 · 人均 ¥${Math.round(p.cost)}</span>` : `<span class="fee ${c}">${t}</span>`;
    }
    function placeCard(p) {
      const catName = (PLACES.cats.find(c => c.id === p.cat) || {}).name || '';
      const meta = [p.area, p.type].filter(Boolean).join(' · ');
      const sr = scenicRank(p.id);
      return `<a class="panel pcard" href="#place=${esc(p.id)}" data-pid="${esc(p.id)}" title="查看详情">
        <div class="ph" data-photos="${esc(JSON.stringify(p.photos))}" style="background-image:url('${esc(p.photos[0]).replace(/'/g, '%27')}')">
          <span class="cat">${CAT_ICON[p.cat] || ''} ${esc(catName)}</span>
          ${sr ? `<span class="rk">🏆 景点榜 #${sr.rank}</span>` : ''}
          ${p.photos.length > 1 ? `<span class="np">${p.photos.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</span>` : ''}
          ${p.rating ? `<span class="rt">★ ${p.rating.toFixed(1)}</span>` : ''}
        </div>
        <div class="pb"><div class="pn">${esc(p.name)}</div>
          <div class="pm">${esc(meta)}</div>
          <div class="pt">${feeBadge(p)}${(p.tags || []).slice(0, 2).map(t => `<span class="badge">${esc(t)}</span>`).join('')}</div>
        </div></a>`;
    }
    function placeList(code, cat) {
      const cats = PLACES.districts[code]?.cats || {};
      return cat === 'rec' ? recMix(cats) : freeFirst(cats[cat] || []);
    }
    function renderPlaces() {
      if (!PLACES) return;
      const order = PLACES.districts_order.filter(c => PLACES.districts[c]);
      if (!PLACES.districts[plState.district]) plState.district = PLACES.default in PLACES.districts ? PLACES.default : order[0];
      const D = PLACES.districts[plState.district], cats = D.cats;
      $('#pl-district').innerHTML = order.map(c => `<button class="chip ${c === plState.district ? 'active' : ''}" data-d="${c}">${esc(PLACES.districts[c].name)}${c === PLACES.default ? '<span class="n">默认</span>' : ''}</button>`).join('');
      const tabs = [['rec', '推荐'], ...PLACES.cats.filter(c => c.id !== 'food').map(c => [c.id, c.name])];   // 吃喝单独成区块
      if (!tabs.some(t => t[0] === plState.cat)) plState.cat = 'rec';
      $('#pl-cats').innerHTML = tabs.map(([id, n]) => `<button class="chip ${plState.cat === id ? 'active' : ''}" data-c="${id}">${CAT_ICON[id] || ''} ${esc(n)}${id === 'rec' ? '' : `<span class="n">${(cats[id] || []).filter(x => x.fee === 'free').length} 免费</span>`}</button>`).join('');
      let list = placeList(plState.district, plState.cat);
      $('#pl-fee').innerHTML = [['all', '全部'], ['free', '只看免费'], ['paid', '收费']].map(([k, n]) =>
        `<button class="${plState.fee === k ? 'active' : ''}" data-f="${k}">${n}<span class="n num">${k === 'all' ? list.length : list.filter(x => x.fee === k).length}</span></button>`).join('');
      if (plState.fee !== 'all') list = list.filter(x => x.fee === plState.fee);
      const shown = plState.more ? list : list.slice(0, 12);
      const rainy = weekendRainy();
      const nFree = shown.filter(x => x.fee === 'free').length;
      $('#pl-sub').textContent = `${D.name}区 · 免费的优先 · 点卡片看详情`;
      $('#pl-grid').innerHTML = (plState.cat === 'rec' ? `<div class="rec-why" style="grid-column:1/-1">${rainy ? '☔ 周末两天有雨，优先室内遛娃、博物馆' : '🌿 周末天气还行，优先露营、户外和遛娃'} · 这一屏 ${nFree} 个免费</div>` : '')
        + (shown.length ? shown.map(placeCard).join('') : '<div class="panel empty" style="grid-column:1/-1">这个区暂时没有这类地点</div>')
        + (list.length > shown.length ? `<a class="panel see-all" href="${listHash({ k: 'places', d: plState.district, c: plState.cat, f: plState.fee })}">查看全部 ${list.length} 个 →</a>` : '');
    }
    $('#pl-fee').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; plState.fee = b.dataset.f; plState.more = false; store.set('plFee', plState.fee); renderPlaces(); });

    // ── 吃什么：扫街榜（本区上榜 → 全杭州榜单）在前，高德评分补齐 ──
    const fdState = { tab: store.get('fdTab', 'rank'), more: false };
    function foodList(tab, code = plState.district) {
      const R = PLACES.rankings?.lists || {};
      const tag = (x, kind) => ({ ...x, cat: 'food', fee: 'paid', _badge: kind === 'food' ? `🏆 扫街榜状元榜 #${x.rank}` : '💎 极致甄选', _score: x.score });
      const ranked = [...(R.food || []).map(x => tag(x, 'food')), ...(R['select-food'] || []).map(x => tag(x, 'select'))].filter(x => x.photos?.length);
      const local = ranked.filter(x => x.adcode === code), city = ranked.filter(x => x.adcode !== code);
      const amap = [...(PLACES.districts[code]?.cats.food || [])].sort((a, b) => (b.rating || 0) - (a.rating || 0));
      if (tab === 'rank') return [...local, ...city];
      if (tab === 'local') return [...local, ...amap.filter(x => !local.some(y => y.id === x.id))];
      if (tab === 'cheap') return amap.filter(x => x.cost && x.cost <= 60);
      if (tab === 'cafe') return amap.filter(x => /咖啡|茶/.test(x.name + x.type));
      return amap;
    }
    function foodRow(p, i) {
      const meta = [p.area, p.keytag || p.type].filter(Boolean).join(' · ');
      return `<a class="panel rrow" href="#place=${esc(p.id)}" data-pid="${esc(p.id)}">
        <span class="rn num">${String(i + 1).padStart(2, '0')}</span>
        <i class="rph" style="background-image:url('${esc(p.photos[0]).replace(/'/g, '%27')}')"></i>
        <div class="rb"><div class="pn">${esc(p.name)}</div>
          <div class="rs">${p._badge ? `<span class="rbadge">${esc(p._badge)}</span>` : ''}${p._score ? `<b>综合分 ${p._score.toFixed(2)}</b>` : p.rating ? `<b>★ ${p.rating.toFixed(1)}</b>` : ''}${p.cost ? `<span>人均 ¥${Math.round(p.cost)}</span>` : ''}</div>
          <div class="pm">${esc(meta)}</div>
          ${(p.dishes?.length ? p.dishes : p.tags || []).length ? `<div class="pt">${(p.dishes?.length ? p.dishes : p.tags).slice(0, 3).map(t => `<span class="badge">${esc(t)}</span>`).join('')}</div>` : ''}
        </div></a>`;
    }
    function renderFood() {
      if (!PLACES) return;
      const D = PLACES.districts[plState.district];
      const tabs = [['rank', '🏆 扫街榜'], ['local', `📍 ${D?.name || ''}高分`], ['cheap', '💰 人均 ≤ ¥60'], ['cafe', '☕ 咖啡茶饮']];
      $('#fd-tabs').innerHTML = tabs.map(([k, n]) => `<button class="chip ${fdState.tab === k ? 'active' : ''}" data-t="${k}">${esc(n)}<span class="n">${foodList(k).length}</span></button>`).join('');
      const list = foodList(fdState.tab), shown = fdState.more ? list : list.slice(0, 10);
      const title = PLACES.rankings?.title?.food || '';
      $('#fd-sub').textContent = fdState.tab === 'rank' ? `${title}（高德扫街榜网页版）· ${D?.name || ''}区上榜的排前面` : `${D?.name || ''}区 · 高德评分`;
      $('#fd-list').innerHTML = (shown.length ? shown.map(foodRow).join('') : '<div class="panel empty" style="grid-column:1/-1">暂无</div>')
        + (list.length > shown.length ? `<a class="panel see-all" href="${listHash({ k: 'food', d: plState.district, t: fdState.tab })}">查看全部 ${list.length} 家 →</a>` : '');
    }
    $('#fd-tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; fdState.tab = b.dataset.t; fdState.more = false; store.set('fdTab', fdState.tab); renderFood(); });
    $('#fd-list').addEventListener('click', e => {
      if (e.target.closest('[data-more]')) { e.preventDefault(); fdState.more = true; return renderFood(); }
      const a = e.target.closest('[data-pid]'); if (a) { e.preventDefault(); openPlace(a.dataset.pid); }
    });
    $('#pl-district').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; plState.district = b.dataset.d; plState.more = false; store.set('district', plState.district); renderPlaces(); renderFood(); });
    $('#pl-cats').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; plState.cat = b.dataset.c; plState.more = false; store.set('plCat', plState.cat); renderPlaces(); });
    $('#pl-grid').addEventListener('click', e => { if (e.target.closest('[data-more]')) { e.preventDefault(); plState.more = true; renderPlaces(); } });
    // 鼠标在照片上左右移动切换同一地点的 3 张照片
    $('#pl-grid').addEventListener('mousemove', e => {
      const ph = e.target.closest('.ph[data-photos]'); if (!ph) return;
      const photos = JSON.parse(ph.dataset.photos); if (photos.length < 2) return;
      const r = ph.getBoundingClientRect(), i = Math.min(photos.length - 1, Math.floor((e.clientX - r.left) / r.width * photos.length));
      if (ph.dataset.i == i) return;
      ph.dataset.i = i; ph.style.backgroundImage = `url('${photos[i].replace(/'/g, '%27')}')`;
      ph.querySelectorAll('.np i').forEach((d, k) => d.classList.toggle('on', k === i));
    });

    // ── 地点详情：页面内弹窗，网址带 #place=ID 可分享 ──
    const isMobile = matchMedia('(max-width: 760px)').matches || /iPhone|Android/i.test(navigator.userAgent);
    function findPlace(id) {
      for (const d of Object.values(PLACES?.districts || {})) for (const l of Object.values(d.cats)) { const p = l.find(x => x.id === id); if (p) return p; }
      for (const l of Object.values(PLACES?.rankings?.lists || {})) { const p = l.find(x => x.id === id); if (p) return { cat: 'food', fee: 'paid', type: '', ...p }; }
      return null;
    }
    function weekendTip(cat) {
      if (!DATA) return '';
      const by = Object.fromEntries((DATA.daily || []).map(x => [x.date, x]));
      const days = DATA.weekend.map((d, i) => ({ n: i ? '周日' : '周六', x: by[d] })).filter(o => o.x);
      if (!days.length) return '';
      const line = days.map(o => `${o.n} ${icon(o.x.text, o.x.code)} ${esc(o.x.text || WMO(o.x.code))} ${o.x.tmin}~${o.x.tmax}°`).join(' · ');
      const rain = days.filter(o => advise(o.x).indoor).map(o => o.n);
      const outdoor = ['camp', 'outdoor'].includes(cat);
      let tip;
      if (outdoor) tip = rain.length === days.length ? '两天都有雨：露营选有雨棚的营位、带防潮垫，户外山路湿滑，雨大建议改期' : rain.length ? `${rain[0]}有雨，建议安排在另一天去` : '天气合适，记得防晒、带足水';
      else if (cat === 'kids') tip = rain.length ? '有雨的话优先室内项目，户外农场、乐园记得带雨具和备用衣服' : '天气不错，户外区可以玩个痛快';
      else tip = rain.length ? '下雨天去正合适' : '周末人多，热门时段建议提前预约 / 排号';
      return `<div class="wtip">${line}<br>💡 ${tip}</div>`;
    }
    let galIdx = 0, CUR = null;
    function renderSheet() {
      const p = CUR, ph = p.photos || [];
      const catName = (PLACES.cats.find(c => c.id === p.cat) || {}).name || '';
      const q = encodeURIComponent(p.name);
      const detail = isMobile ? `https://m.amap.com/detail/index/poiid=${p.id}` : `https://www.amap.com/place/${p.id}`;
      const nav = `https://uri.amap.com/marker?position=${p.lng},${p.lat}&name=${q}&src=hz-weekend&callnative=1`;
      // 推荐标签和类型标签相同时（高德常见）不重复显示
      const tags = [...new Set([p.keytag, ...(p.rectag ? p.rectag.split(',').filter(t => t !== p.keytag).map(t => '推荐：' + t) : []), ...(p.tags || [])].filter(Boolean))];
      $('#pl-sheet').innerHTML = `<button class="x" data-close aria-label="关闭">✕</button>
        <div class="gal" style="background-image:url('${esc(ph[galIdx] || '').replace(/'/g, '%27')}')">
          ${ph.length > 1 ? '<button class="nav prev" data-g="-1" aria-label="上一张">‹</button><button class="nav next" data-g="1" aria-label="下一张">›</button>' : ''}</div>
        ${ph.length > 1 ? `<div class="thumbs">${ph.map((u, i) => `<i class="${i === galIdx ? 'on' : ''}" data-gi="${i}" style="background-image:url('${esc(u).replace(/'/g, '%27')}')"></i>`).join('')}</div>` : ''}
        <div class="sbody">
          <h3>${esc(p.name)}</h3>
          <div class="score">${p.score ? `<b>综合分 ${p.score.toFixed(2)}</b>` : p.rating ? `<b>★ ${p.rating.toFixed(1)}</b>` : ''}${feeBadge(p)}<span>${CAT_ICON[p.cat] || ''} ${esc(catName || '吃喝')}${p.type ? ' · ' + esc(p.type) : ''}</span></div>
          ${tags.length ? `<div class="pt">${tags.slice(0, 6).map(t => `<span class="badge">${esc(t)}</span>`).join('')}</div>` : ''}
          <div class="info">
            <div><span>📍</span><span>${esc([p.area, p.addr].filter(Boolean).join(' '))}</span></div>
            ${p.week || p.open ? `<div><span>🕘</span><span>${esc(p.week || p.open)}</span></div>` : ''}
            ${p.tel ? `<div><span>📞</span><span><a href="tel:${esc(p.tel)}">${esc(p.tel)}</a></span></div>` : ''}
          </div>
          ${weekendTip(p.cat)}
          <div class="acts">
            <a class="primary" href="${esc(detail)}" target="_blank" rel="noopener">高德详情与评价</a>
            <a href="${esc(nav)}" target="_blank" rel="noopener">导航过去</a>
            <a href="https://www.xiaohongshu.com/search_result?keyword=${q}" target="_blank" rel="noopener">小红书攻略</a>
            <a href="https://www.dianping.com/search/keyword/3/0_${q}" target="_blank" rel="noopener">大众点评</a>
          </div>
        </div>`;
    }
    // ── 路由：#/list?…= 列表页；place=ID 可以挂在首页（#place=ID）或列表页（…&place=ID）后面 ──
    function listHash(o) { return '#/list?' + new URLSearchParams(Object.entries(o).filter(([, v]) => v)).toString(); }
    function parseHash() {
      const h = location.hash, isList = h.startsWith('#/list');
      const q = new URLSearchParams(isList ? h.slice(h.indexOf('?') + 1) : h.slice(1));
      return { isList, q, place: q.get('place') };
    }
    function hashWithout(key) {
      const { isList, q } = parseHash(); q.delete(key);
      return isList ? '#/list?' + q.toString() : (q.toString() ? '#' + q.toString() : location.pathname + location.search);
    }
    function openPlace(id, push = true) {
      const p = findPlace(id); if (!p) return;
      CUR = p; galIdx = 0; renderSheet();
      $('#pl-modal').hidden = false; document.body.style.overflow = 'hidden';
      if (push && parseHash().place !== id) {
        const { isList } = parseHash();
        history.pushState(null, '', isList ? hashWithout('place') + '&place=' + id : '#place=' + id);
      }
    }
    function closePlace(back = true) {
      if ($('#pl-modal').hidden) return;
      $('#pl-modal').hidden = true; document.body.style.overflow = '';
      if (back && parseHash().place) history.back();
    }
    function openFromHash() { const id = parseHash().place; if (id) openPlace(id, false); }
    let homeScroll = 0, wasList = false;
    function route() {
      if (!PLACES) return;
      const { isList, q, place } = parseHash();
      if (isList !== wasList) {
        if (isList) homeScroll = scrollY;
        $('#home').hidden = isList; $('#listview').hidden = !isList;
        if (isList) scrollTo(0, 0); else requestAnimationFrame(() => scrollTo(0, homeScroll));
        wasList = isList;
      }
      if (isList) renderListView(q);
      if (place) openPlace(place, false); else closePlace(false);
    }
    // 列表页：带着首页的区 / 类别 / 免费筛选进来，在这里还能继续切换（用 replaceState，不堆历史）
    function renderListView(q) {
      const k = q.get('k') || 'places', code = PLACES.districts[q.get('d')] ? q.get('d') : plState.district;
      const D = PLACES.districts[code], set = o => { const n = new URLSearchParams(q); Object.entries(o).forEach(([a, v]) => n.set(a, v)); n.delete('place'); history.replaceState(null, '', '#/list?' + n); renderListView(n); };
      const order = PLACES.districts_order.filter(c => PLACES.districts[c]);
      const dChips = order.map(c => `<button class="chip ${c === code ? 'active' : ''}" data-ld="${c}">${esc(PLACES.districts[c].name)}</button>`).join('');
      let head, filters, body;
      if (k === 'food') {
        const t = q.get('t') || 'rank', list = foodList(t, code);
        const tabs = [['rank', '🏆 扫街榜'], ['local', `📍 ${D.name}高分`], ['cheap', '💰 人均 ≤ ¥60'], ['cafe', '☕ 咖啡茶饮']];
        head = `吃什么 · ${esc(D.name)}<small> · ${list.length} 家</small>`;
        filters = `<div class="chips">${tabs.map(([v, n]) => `<button class="chip ${t === v ? 'active' : ''}" data-lt="${v}">${esc(n)}</button>`).join('')}</div>`;
        body = `<div class="rlist">${list.map(foodRow).join('') || '<div class="panel empty">暂无</div>'}</div>`;
      } else {
        const c = q.get('c') || 'rec', f = q.get('f') || 'all';
        let list = placeList(code, c);
        const tabs = [['rec', '推荐'], ...PLACES.cats.filter(x => x.id !== 'food').map(x => [x.id, x.name])];
        const seg = [['all', '全部'], ['free', '只看免费'], ['paid', '收费']].map(([v, n]) => `<button class="${f === v ? 'active' : ''}" data-lf="${v}">${n}<span class="n num">${v === 'all' ? list.length : list.filter(x => x.fee === v).length}</span></button>`).join('');
        if (f !== 'all') list = list.filter(x => x.fee === f);
        const catName = (tabs.find(x => x[0] === c) || [])[1] || '';
        head = `玩什么 · ${esc(D.name)} · ${esc(catName)}<small> · ${list.length} 个</small>`;
        filters = `<div class="bar2"><div class="chips">${tabs.map(([v, n]) => `<button class="chip ${c === v ? 'active' : ''}" data-lc="${v}">${CAT_ICON[v] || ''} ${esc(n)}</button>`).join('')}</div><div class="seg">${seg}</div></div>`;
        body = `<div class="pgrid">${list.map(placeCard).join('') || '<div class="panel empty" style="grid-column:1/-1">这个区暂时没有这类地点</div>'}</div>`;
      }
      $('#listview').innerHTML = `<div class="lv-head"><a class="lv-back" href="#" data-back>← 返回</a><h2>${head}</h2></div>
        <div class="chips">${dChips}</div>${filters}${body}`;
      $('#listview').onclick = e => {
        const el = e.target.closest('[data-back],[data-ld],[data-lt],[data-lc],[data-lf],[data-pid]'); if (!el) return;
        e.preventDefault();
        if ('back' in el.dataset) return history.length > 1 && wasListEntered ? history.back() : (location.hash = '');
        if (el.dataset.pid) return openPlace(el.dataset.pid);
        if (el.dataset.ld) return set({ d: el.dataset.ld });
        if (el.dataset.lt) return set({ t: el.dataset.lt });
        if (el.dataset.lc) return set({ c: el.dataset.lc, f: 'all' });
        if (el.dataset.lf) return set({ f: el.dataset.lf });
      };
    }
    let wasListEntered = false;                  // 从首页点进来的才用 history.back()，直接打开链接的回首页
    document.addEventListener('click', e => { if (e.target.closest('.see-all')) wasListEntered = true; });
    $('#pl-grid').addEventListener('click', e => { const a = e.target.closest('[data-pid]'); if (!a) return; e.preventDefault(); openPlace(a.dataset.pid); });
    $('#pl-modal').addEventListener('click', e => {
      if (e.target.id === 'pl-modal' || e.target.closest('[data-close]')) return closePlace();
      const g = e.target.closest('[data-g]'), gi = e.target.closest('[data-gi]');
      if (g || gi) { const n = CUR.photos.length; galIdx = gi ? +gi.dataset.gi : (galIdx + +g.dataset.g + n) % n; renderSheet(); }
    });
    addEventListener('keydown', e => { if (e.key === 'Escape') closePlace(); });
    addEventListener('popstate', route);
    addEventListener('hashchange', route);

    // 下一个假期（拼假攻略站的数据）
    let HOL = '';
    function addHol() { const el = $('#wk-sub'); if (HOL && !el.querySelector('.hol')) el.insertAdjacentHTML('beforeend', HOL); }
    async function loadHoliday() {
      try {
        const h = await fetch('https://climb0516.github.io/holiday-planner/data.json', { cache: 'no-cache' }).then(r => r.json());
        const n = h.summary?.next; if (!n) return;
        HOL = ` · <span class="hol">下个假期 <b>${esc(n.name)}</b> ${md(n.date)}，还有 ${n.days} 天${n.est ? '（预估）' : ''}</span>`;
        addHol();
      } catch (e) {}
    }

    // 活动：免费活动 / 演出玩乐 两个标签切换
    $('#ev-tab').addEventListener('click', e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      $('#ev-tab').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      $('#ev-free').hidden = b.dataset.t !== 'free'; $('#ev-fun').hidden = b.dataset.t !== 'fun';
    });

    let DATA = null;
    async function load() {
      const btn = $('#reload');
      btn.classList.add('spin');
      try {
        // no-cache：每次向服务器校验，更新后立刻可见；失败时保留现有内容
        const d = await fetch('data.json', { cache: 'no-cache' }).then(r => r.json());
        DATA = d;
        renderWeather(d); renderExh(d); renderEvents(d); renderSources(d);
        loadPlaces(); loadHoliday();
      } catch (e) {
        if (!DATA) $('#updated').textContent = '数据加载失败';
        console.error(e);
      } finally {
        btn.classList.remove('spin');
      }
    }

    function applyTheme(t) { document.documentElement.dataset.theme = t; }
    applyTheme(store.get('theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
    $('#theme').addEventListener('click', () => {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(t); store.set('theme', t);
    });
    $('#reload').addEventListener('click', load);
    load();
  </script>
</body>
</html>
